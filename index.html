<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CELESTIA — 出生天球</title>
<meta name="description" content="出生時刻・場所から天球を再構成し、恒星・星座・太陽系天体をブラウザ上の 3D で描く天球図。">
<meta name="theme-color" content="#04060c">

<link rel="icon" href="assets/icons/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/svg+xml" href="assets/icons/icon-simple.svg">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">

<meta property="og:type" content="website">
<meta property="og:site_name" content="celestia">
<meta property="og:title" content="CELESTIA — 出生天球">
<meta property="og:description" content="出生時刻・場所から天球を再構成し、恒星・星座・太陽系天体をブラウザ上の 3D で描く天球図。">
<meta property="og:url" content="https://tomu-ai963.github.io/celestia/">
<meta property="og:image" content="https://tomu-ai963.github.io/celestia/assets/icons/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Shippori+Mincho:wght@400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --void:#04060c;
  --deep:#0a0f1c;
  --gold:#d9b45f;
  --gold-dim:#8a7238;
  --ice:#dfe7f2;
  --violet:#7d6fb0;
  --line:rgba(217,180,95,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--void);color:var(--ice);
  font-family:'Shippori Mincho','Cormorant Garamond',serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
canvas#sky{position:fixed;inset:0;display:block;touch-action:none}

/* ---------- masthead ---------- */
#mast{position:fixed;top:0;left:0;right:0;padding:18px 20px;z-index:5;
  pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start}
#mast h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:20px;
  letter-spacing:.42em;color:var(--gold);text-indent:.42em}
#mast .sub{font-size:10px;letter-spacing:.28em;color:rgba(223,231,242,.38);margin-top:6px;text-indent:.28em}
#stamp{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;
  text-align:right;color:rgba(223,231,242,.45);line-height:1.7}

/* ---------- readout ---------- */
#readout{position:fixed;left:0;top:96px;bottom:226px;width:236px;z-index:4;
  overflow-y:auto;padding:0 0 0 20px;-webkit-overflow-scrolling:touch;
  mask-image:linear-gradient(180deg,transparent,#000 16px,#000 calc(100% - 16px),transparent);
  scrollbar-width:none}
#readout::-webkit-scrollbar{display:none}
.body-row{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:baseline;
  padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;
  opacity:.55;transition:opacity .3s}
.body-row:hover,.body-row.on{opacity:1}
.body-row .dot{width:7px;height:7px;border-radius:50%;justify-self:center;
  transform:translateY(-2px);box-shadow:0 0 8px currentColor}
.body-row .nm{font-size:13px;letter-spacing:.08em}
.body-row .sg{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.02em;
  color:var(--gold);text-align:right;white-space:nowrap}
.body-row .sg em{font-style:normal;color:rgba(223,231,242,.4)}
.rd-head{font-size:9px;letter-spacing:.3em;color:var(--gold-dim);
  padding:14px 0 6px;text-indent:.3em}

/* ---------- console ---------- */
#console{position:fixed;left:0;right:0;bottom:0;z-index:6;
  background:linear-gradient(180deg,rgba(4,6,12,0) 0%,rgba(4,6,12,.93) 26%,rgba(4,6,12,.99) 100%);
  padding:26px 20px calc(20px + env(safe-area-inset-bottom));
  border-top:1px solid transparent}
#console.open{border-top-color:var(--line)}
#grip{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
#grip .bar{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
#grip span{font-size:10px;letter-spacing:.26em;color:var(--gold);white-space:nowrap}
#form{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.2,.8,.2,1)}
#console.open #form{max-height:min(560px,58vh);overflow-y:auto}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;padding:20px 0 16px;max-width:520px}
.f{display:flex;flex-direction:column;gap:5px}
.f.wide{grid-column:1/-1}
label{font-size:9px;letter-spacing:.24em;color:rgba(223,231,242,.42)}
input,select{background:transparent;border:none;border-bottom:1px solid rgba(217,180,95,.28);
  color:var(--ice);font-family:'JetBrains Mono',monospace;font-size:14px;padding:5px 2px;
  border-radius:0;-webkit-appearance:none;appearance:none;width:100%}
select{background-image:linear-gradient(45deg,transparent 50%,var(--gold-dim) 50%),
  linear-gradient(135deg,var(--gold-dim) 50%,transparent 50%);
  background-position:calc(100% - 9px) 12px,calc(100% - 5px) 12px;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;padding-right:20px}
select option{background:var(--deep);color:var(--ice)}
input:focus,select:focus{outline:none;border-bottom-color:var(--gold)}
input[type=date],input[type=time]{color-scheme:dark}
/* 出生地の検索行とタイムゾーン */
.searchrow{display:flex;gap:8px;align-items:flex-end}
.searchrow input{flex:1}
button.go.sm{padding:5px 12px;font-size:10px;white-space:nowrap}
#qmsg,#tzinfo{font-size:10px;letter-spacing:.06em;color:rgba(223,231,242,.42);
  min-height:13px;padding-top:4px;line-height:1.5}
#qmsg.err{color:#e08a5f}
#qmsg.ok{color:var(--gold-dim)}
#tzinfo b{font-weight:400;color:var(--gold-dim);font-family:'JetBrains Mono',monospace}
#tzinfo .warn{color:#e08a5f}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-bottom:4px}
button.go{background:transparent;border:1px solid var(--gold);color:var(--gold);
  font-family:'Shippori Mincho',serif;font-size:12px;letter-spacing:.24em;
  padding:11px 26px;cursor:pointer;transition:.3s;text-indent:.24em}
button.go:hover{background:var(--gold);color:var(--void)}
.tog{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.14em;
  color:rgba(223,231,242,.5);cursor:pointer;user-select:none}
.tog i{width:26px;height:14px;border:1px solid rgba(217,180,95,.4);border-radius:8px;
  position:relative;transition:.3s;font-style:normal;flex:none}
.tog i::after{content:'';position:absolute;top:2px;left:2px;width:8px;height:8px;
  border-radius:50%;background:var(--gold-dim);transition:.3s}
.tog.on i{border-color:var(--gold)}
.tog.on i::after{left:14px;background:var(--gold)}
.tog.on{color:var(--gold)}

/* ---------- time bar ---------- */
#timebar{display:flex;align-items:center;gap:9px;padding:0 0 15px;flex-wrap:wrap}
.tb{background:transparent;border:1px solid rgba(217,180,95,.34);color:var(--gold);
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;
  padding:6px 8px;min-width:30px;cursor:pointer;transition:.25s;border-radius:0;line-height:1}
.tb:hover{background:rgba(217,180,95,.13)}
.tb.on{background:var(--gold);color:var(--void);border-color:var(--gold)}
.tb:disabled{opacity:.3;cursor:default}
#scales{display:flex}
#scales .tb+.tb{border-left:none}
#tslide{flex:1 1 190px;min-width:120px;height:20px;background:transparent;
  -webkit-appearance:none;appearance:none;cursor:pointer;padding:0;border:none}
#tslide::-webkit-slider-runnable-track{height:1px;
  background:linear-gradient(90deg,rgba(217,180,95,.25),rgba(217,180,95,.75))}
#tslide::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
  background:var(--gold);margin-top:-5px;box-shadow:0 0 9px rgba(217,180,95,.75)}
#tslide::-moz-range-track{height:1px;background:rgba(217,180,95,.5)}
#tslide::-moz-range-thumb{width:11px;height:11px;border:none;border-radius:50%;
  background:var(--gold);box-shadow:0 0 9px rgba(217,180,95,.75)}
#tslide:focus{outline:none}
#tnow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.03em;
  color:rgba(223,231,242,.72);white-space:nowrap}
#tnow .off{color:var(--gold-dim)}
#tnow .edge{color:var(--gold)}
.body-row .sg .rx{font-style:normal;color:#e08a5f;margin-left:4px}
/* 軌跡がサンプル間隔より速い天体（＝軌跡を描いていない）の印 */
.body-row .sg .nt{font-style:normal;color:rgba(223,231,242,.3);margin-left:4px}
#card .rx{color:#e08a5f}
#card .muted{color:rgba(223,231,242,.45)}

/* ---------- focus card ---------- */
#card{position:fixed;right:20px;top:96px;width:212px;z-index:5;
  border:1px solid var(--line);background:rgba(6,9,18,.82);backdrop-filter:blur(9px);
  padding:15px 16px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:.4s}
#card.show{opacity:1;transform:none}
#card h3{font-size:16px;letter-spacing:.16em;font-weight:400;margin-bottom:3px}
#card .lat{font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.3em;
  color:var(--gold-dim);margin-bottom:11px}
#card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;
  font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.6}
#card dt{color:rgba(223,231,242,.36);letter-spacing:.04em}
#card dd{text-align:right;color:var(--ice)}

#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:142px;z-index:3;
  font-size:10px;letter-spacing:.22em;color:rgba(223,231,242,.22);pointer-events:none;
  transition:opacity .6s}

#starload{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:3;
  font-size:11px;letter-spacing:.32em;text-indent:.32em;color:var(--gold);
  pointer-events:none;text-align:center;line-height:2;opacity:.8;
  transition:opacity .9s;animation:starpulse 2.2s ease-in-out infinite}
#starload.done{opacity:0;animation:none}
#starload.err{color:var(--gold-dim);animation:none;opacity:.9}
@keyframes starpulse{0%,100%{opacity:.8}50%{opacity:.35}}

/* ---------- 折りたたみカテゴリ（トグルが増えてもコンソールが破綻しないように） ---------- */
.grp{border-top:1px solid rgba(217,180,95,.12)}
.grp>summary{list-style:none;cursor:pointer;user-select:none;display:flex;align-items:center;gap:9px;
  padding:10px 0;font-size:9px;letter-spacing:.26em;color:var(--gold-dim)}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:'＋';font-size:9px;color:var(--gold-dim)}
.grp[open]>summary::before{content:'−'}
.grp>summary .tag{font-family:'JetBrains Mono',monospace;letter-spacing:.02em;
  color:rgba(223,231,242,.28);font-size:9px}
.togs{display:flex;gap:11px 20px;flex-wrap:wrap;padding:2px 0 12px}
#astroPanel{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px;max-width:520px;
  padding:2px 0 14px;border-left:1px solid rgba(125,111,176,.35);padding-left:14px;margin-bottom:10px}
#astroPanel[hidden]{display:none}
#astroPanel .f.wide{grid-column:1/-1}
#astroPanel .hint{font-size:9px;letter-spacing:.06em;color:rgba(223,231,242,.3);line-height:1.6}
#orb{-webkit-appearance:none;appearance:none;height:18px;background:transparent;cursor:pointer;
  padding:0;border:none;width:100%}
#orb::-webkit-slider-runnable-track{height:1px;background:rgba(125,111,176,.55)}
#orb::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;
  background:var(--violet);margin-top:-5px;box-shadow:0 0 8px rgba(125,111,176,.7)}
#orb::-moz-range-track{height:1px;background:rgba(125,111,176,.55)}
#orb::-moz-range-thumb{width:10px;height:10px;border:none;border-radius:50%;background:var(--violet)}
#astroNote{grid-column:1/-1;font-size:10px;line-height:1.6;letter-spacing:.04em;
  color:rgba(223,231,242,.42);min-height:13px}
#astroNote.warn{color:#e08a5f}
.rd-ang{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--violet)}
#card dd.hs{color:var(--violet)}
#cdInterp{margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07);
  font-size:11px;line-height:1.75;letter-spacing:.03em;color:rgba(223,231,242,.72)}
#cdInterp.none{color:rgba(223,231,242,.3);font-size:10px;line-height:1.6}
#cdInterp[hidden]{display:none}

@media (max-width:720px){
  #timebar{gap:7px;padding-bottom:12px}
  #astroPanel{grid-template-columns:1fr}
  #tnow{order:-1;width:100%;font-size:10px}
  #tslide{flex-basis:100%;order:1}
  #readout{top:auto;bottom:184px;width:100%;height:118px;padding:0 16px;
    display:flex;gap:0;overflow-x:auto;overflow-y:hidden;flex-direction:column;
    flex-wrap:wrap;align-content:flex-start;
    mask-image:linear-gradient(90deg,#000 calc(100% - 30px),transparent)}
  .body-row{width:150px;padding:5px 0;margin-right:16px}
  .rd-head{display:none}
  #card{right:16px;left:16px;width:auto;top:86px}
  #mast{padding:14px 16px}
  #hint{display:none}
  .fields{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div id="mast">
  <div>
    <h1>CELESTIA</h1>
    <div class="sub">出生天球 / NATAL SKY</div>
  </div>
  <div id="stamp"></div>
</div>

<div id="readout"></div>

<div id="card">
  <h3 id="cdName">—</h3>
  <div class="lat" id="cdLat"></div>
  <dl>
    <dt>黄経</dt><dd id="cdLon">—</dd>
    <dt>黄緯</dt><dd id="cdLat2">—</dd>
    <dt>距離</dt><dd id="cdDist">—</dd>
    <dt>サイン</dt><dd id="cdSign">—</dd>
    <dt>実星座</dt><dd id="cdConst">—</dd>
    <dt>運動</dt><dd id="cdMot">—</dd>
    <dt>出生時から</dt><dd id="cdNatal">—</dd>
    <dt id="cdHouseK" hidden>ハウス</dt><dd id="cdHouse" class="hs" hidden>—</dd>
    <dt id="cdAspK" hidden>アスペクト</dt><dd id="cdAsp" hidden>—</dd>
  </dl>
  <div id="cdInterp" hidden></div>
</div>

<div id="hint">ドラッグで視点移動 · ホイールでズーム</div>
<div id="starload">星野を読み込み中</div>

<div id="console" class="open">
  <div id="timebar">
    <button class="tb" id="tPlay" title="再生 / 一時停止">▶</button>
    <button class="tb" id="tSlower" title="速度を下げる／逆再生">◀◀</button>
    <button class="tb" id="tFaster" title="速度を上げる">▶▶</button>
    <button class="tb" id="tSpeed" title="現在の速度" disabled>×1</button>
    <div id="scales">
      <button class="tb on" data-s="hour">時</button>
      <button class="tb" data-s="day">日</button>
      <button class="tb" data-s="month">月</button>
      <button class="tb" data-s="year">年</button>
    </div>
    <input type="range" id="tslide" min="0" max="1" step="0.0000001" value="0.5"
           aria-label="日時">
    <button class="tb" id="tHome" title="出生時刻に戻す">↺</button>
    <div id="tnow">—</div>
  </div>
  <div id="grip"><span>◇ 出生データ</span><div class="bar"></div><span id="gripState">閉じる</span></div>
  <div id="form">
    <div class="fields">
      <div class="f"><label>生年月日</label><input type="date" id="d" value="1990-07-14"></div>
      <div class="f"><label>出生時刻（現地）</label><input type="time" id="t" value="09:30"></div>
      <div class="f wide"><label>出生地を検索</label>
        <div class="searchrow">
          <input type="search" id="q" placeholder="金沢 / Reykjavik / Sydney …"
                 autocomplete="off" enterkeyhint="search">
          <button class="go sm" id="qgo">検索</button>
        </div>
        <div id="qmsg"></div>
      </div>
      <div class="f wide"><label>プリセット / 検索結果</label>
        <select id="place"></select>
      </div>
      <div class="f"><label>緯度</label><input type="number" id="lat" step="0.0001" value="35.68"></div>
      <div class="f"><label>経度</label><input type="number" id="lon" step="0.0001" value="139.77"></div>
      <div class="f wide"><label>タイムゾーン</label>
        <select id="tz"></select>
        <div id="tzinfo"></div>
      </div>
    </div>
    <div class="actions">
      <button class="go" id="run">天球を生成</button>
    </div>
    <details class="grp" open>
      <summary>天球の表示</summary>
      <div class="togs">
        <div class="tog on" id="tDist"><i></i>距離を反映</div>
        <div class="tog on" id="tHoriz"><i></i><span id="tHorizTx">地平線</span></div>
        <div class="tog" id="tReal"><i></i>実際の星座</div>
        <div class="tog on" id="tTrail"><i></i>軌跡</div>
      </div>
    </details>
    <details class="grp">
      <summary>占星術レイヤー<span class="tag">既定オフ / 天文コアとは別レイヤー</span></summary>
      <div class="togs">
        <div class="tog" id="tAstro"><i></i>ハウスと感受点</div>
      </div>
      <div id="astroPanel" hidden>
        <div class="f"><label>ハウス方式</label>
          <select id="hsMethod">
            <option value="whole">ホールサイン</option>
            <option value="equal">イコール</option>
            <option value="placidus">プラシーダス</option>
          </select>
        </div>
        <div class="f"><label>アスペクトの対象</label>
          <select id="aspSet">
            <option value="none">表示しない</option>
            <option value="core" selected>主要7天体</option>
            <option value="outer">＋外惑星</option>
            <option value="all">全12天体</option>
          </select>
        </div>
        <div class="f wide"><label>オーブ倍率 <span id="orbTx">×1.0</span></label>
          <input type="range" id="orb" min="0.4" max="2" step="0.1" value="1">
          <div class="hint">既定は太陽・月 9°、水星〜火星 7°、木星・土星 6°、天王星〜冥王星 5°、
            交点・リリス 3°（2天体の平均 × アスペクト係数）</div>
        </div>
        <div class="f wide"><div class="tog" id="tInterp"><i></i>解釈テキスト（外部データ）</div></div>
        <div id="astroNote"></div>
      </div>
    </details>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* file:// では ES モジュールも fetch も読めないので、先に案内を出す（本体は起動しない） */
if(location.protocol==='file:'){
  var el=document.getElementById('starload');
  el.className='err';
  el.innerHTML='file:// では動作しません<br>ローカルサーバーで開いてください（README 参照）';
}
</script>
<script type="module">
/* ============================================================
   1. 天文計算 — src/astro.mjs（テストと共有）
   ============================================================ */
import {
  D2R, R2D, AU, sin, cos, norm, julianDay, computeChart,
  SIGNS, GLYPH, IAU, iauConst, BODIES, lonRates, deltaLon
} from './src/astro.mjs';
import { precessionMatrixThree, eclToThree, eclVecToThree } from './src/precession.mjs';
import { zonedToJd, jdToZoned, zoneList, isValidZone, formatOffset } from './src/timezone.mjs';
import { searchPlace, reasonText } from './src/geocode.mjs';
/* 占星術レイヤー（P4）。天文コアには手を入れず、その出力を入力として受け取る一方向の依存。
   既定オフなので、トグルが off の間は computeHouses も findAspects も呼ばれない */
import {
  computeHouses, houseOf, findAspects, BODY_SETS, HOUSE_METHODS,
  interpretationKeys, interpret, hasInterpreter, signKey
} from './src/astrology.mjs';

/* ============================================================
   2. 3D 天球
   ============================================================ */
const cv=document.getElementById('sky');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.fog=null;
const camera=new THREE.PerspectiveCamera(52,1,0.5,6000);
let camR=430, camTheta=0.9, camPhi=1.25, tR=430, tTheta=0.9, tPhi=1.25;

// 座標規約は src/precession.mjs が持つ（テストと共有）
function ecl2three(x,y,z,s){const v=eclVecToThree(x,y,z,s);return new THREE.Vector3(v[0],v[1],v[2]);}
function eclLL(lon,lat,r){const v=eclToThree(lon,lat,r);return new THREE.Vector3(v[0],v[1],v[2]);}
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* --- 星野 --- */
function starTex(){
  const c=document.createElement('canvas');c.width=c.height=64;
  const g=c.getContext('2d').createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,255,255,.7)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  const ctx=c.getContext('2d');ctx.fillStyle=g;ctx.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}
const SPR=starTex();

/* B-V 色指数 → 色温度（Ballesteros 2012 の近似式）→ RGB（黒体放射の近似） */
function bvToRGB(bv){
  const T=4600*(1/(0.92*bv+1.7)+1/(0.92*bv+0.62));
  const t=Math.min(400,Math.max(20,T/100));
  let r,g,b;
  if(t<=66){ r=255; g=99.4708025861*Math.log(t)-161.1195681661; }
  else { r=329.698727446*Math.pow(t-60,-0.1332047592);
         g=288.1221695283*Math.pow(t-60,-0.0755148492); }
  if(t>=66) b=255;
  else if(t<=19) b=0;
  else b=138.5177312231*Math.log(t-10)-305.0447927307;
  const cl=v=>Math.min(255,Math.max(0,v))/255;
  // 実視では恒星の色は淡いので、白へ 15% 寄せて彩度を落とす
  return [cl(r)*0.85+0.15, cl(g)*0.85+0.15, cl(b)*0.85+0.15];
}
/* 等級 → 点サイズ / 輝度。線形ではなく flux(10^-0.4mag) を知覚圧縮したカーブ。
   サイズと輝度に分配し、1等星の芯の明るさと6等星の視認性を両立させる */
function magSize(mag){ return Math.min(20, Math.max(2.1, 12.5*Math.pow(10,-mag/7))); }
function magBright(mag){ return Math.min(1.05, 0.50+0.62*Math.pow(10,-mag/5.5)); }

/* 天球に固定されたもの（星野・星座線・IAU境界・天の川）の親グループ。
   中身は J2000 で作り、歳差はチャート生成時にこのグループの行列で適用する。
   行列は惑星側（astro.mjs の precessVec）とまったく同じ src/precession.mjs 由来で、
   符号と量は tests/precession.test.mjs が 3D 座標から逆算して押さえている。
   position/rotation から毎フレーム作り直されないよう matrixAutoUpdate を切る */
const celestialGroup=new THREE.Group(); scene.add(celestialGroup);
celestialGroup.matrixAutoUpdate=false;
function applyPrecession(T){ celestialGroup.matrix.set(...precessionMatrixThree(T)); }
const starGroup=new THREE.Group(); celestialGroup.add(starGroup);
function buildStars(data){
  const N=data.count, s=data.stars;
  const pos=new Float32Array(N*3), col=new Float32Array(N*3), sz=new Float32Array(N);
  const R=1600;
  for(let i=0;i<N;i++){
    const lon=s[i*4]/1000, lat=s[i*4+1]/1000, mag=s[i*4+2]/100, ci=s[i*4+3]/100;
    const v=eclToThree(lon,lat,R);
    pos[i*3]=v[0]; pos[i*3+1]=v[1]; pos[i*3+2]=v[2];
    const c=bvToRGB(ci), br=magBright(mag);
    col[i*3]=c[0]*br; col[i*3+1]=c[1]*br; col[i*3+2]=c[2]*br;
    sz[i]=magSize(mag);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.setAttribute('asize',new THREE.BufferAttribute(sz,1));
  const mat=new THREE.ShaderMaterial({
    uniforms:{map:{value:SPR}},
    vertexShader:`attribute float asize;varying vec3 vC;void main(){vC=color;
      vec4 mv=modelViewMatrix*vec4(position,1.);
      gl_PointSize=max(asize*(600./-mv.z),1.7);
      gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform sampler2D map;varying vec3 vC;void main(){
      vec4 t=texture2D(map,gl_PointCoord);gl_FragColor=vec4(vC,1.)*t;}`,
    transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,vertexColors:true
  });
  starGroup.add(new THREE.Points(g,mat));
}
/* --- 星座線（Stellarium western skyculture, CC BY-SA） --- */
const constGroup=new THREE.Group(); celestialGroup.add(constGroup);
function buildConstellations(data){
  const R=1596;
  const toVec=(lon,lat)=>eclLL(lon,lat,R);
  const zod=[], oth=[];
  for(const con of data.constellations){
    const dst=con.zodiac?zod:oth;
    for(const line of con.lines){
      for(let i=0;i+3<line.length;i+=2){
        const a=toVec(line[i]/100,line[i+1]/100), b=toVec(line[i+2]/100,line[i+3]/100);
        // 端点の星を隠さないよう両端を少し詰める
        const d=a.distanceTo(b), t=Math.min(13,d*0.24);
        const dir=b.clone().sub(a).normalize();
        dst.push(a.addScaledVector(dir,t), b.addScaledVector(dir,-t));
      }
    }
  }
  const seg=(pts,color,op)=>{
    if(!pts.length) return;
    constGroup.add(new THREE.LineSegments(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color,transparent:true,opacity:op})));
  };
  seg(oth,0x51698a,0.15); // 黄道12星座以外は暗く
  seg(zod,0xd9b45f,0.34); // 黄道12星座はゴールドで強調
}
async function loadStars(){
  const el=document.getElementById('starload');
  try{
    const [rs,rc]=await Promise.all([fetch('data/stars.json'),fetch('data/constellations.json')]);
    if(!rs.ok||!rc.ok) throw new Error('HTTP '+rs.status+'/'+rc.status);
    buildStars(await rs.json());
    buildConstellations(await rc.json());
    el.classList.add('done');
  }catch(e){
    el.classList.add('err');
    el.innerHTML='星野データを読み込めません<br>ローカルサーバーで開いてください（README 参照）';
  }
}
loadStars();

/* --- 天の川（装飾レイヤー） ---
   注意: これは天文データではない。銀河座標系の向き（銀河北極・銀河中心の J2000 値）
   だけを正確に再現した手続き生成の点群で、HYG 実データの星野（starGroup）とは
   明確に別レイヤー。実星野より背面（半径大きめ）かつ淡く描く。 */
function buildMilkyWay(){
  // 銀河 → 赤道(J2000) → 黄道 の回転を基底ベクトルで構成
  const eqVec=(ra,dec)=>[cos(dec)*cos(ra),cos(dec)*sin(ra),sin(dec)];
  const zg=eqVec(192.85948,27.12825);   // 銀河北極 (J2000)
  let xg=eqVec(266.40500,-28.93617);    // 銀河中心方向 (l=0,b=0)
  const d0=xg[0]*zg[0]+xg[1]*zg[1]+xg[2]*zg[2];
  xg=xg.map((v,i)=>v-zg[i]*d0);         // 直交化（カタログ値の丸め対策）
  const xl=Math.hypot(xg[0],xg[1],xg[2]); xg=xg.map(v=>v/xl);
  const yg=[zg[1]*xg[2]-zg[2]*xg[1], zg[2]*xg[0]-zg[0]*xg[2], zg[0]*xg[1]-zg[1]*xg[0]];
  const E=23.4392911;
  const gal2ecl=(l,b)=>{
    const cb=cos(b), q=[0,1,2].map(i=>xg[i]*cb*cos(l)+yg[i]*cb*sin(l)+zg[i]*sin(b));
    return [q[0], q[1]*cos(E)+q[2]*sin(E), -q[1]*sin(E)+q[2]*cos(E)];
  };
  const N=9000, pos=new Float32Array(N*3), col=new Float32Array(N*3), sz=new Float32Array(N);
  const R=1660;
  let i=0;
  while(i<N){
    const l=Math.random()*360;
    const dl=norm(l+180)-180;                       // 銀河中心からの銀経差 [-180,180)
    const toC=Math.exp(-dl*dl/(2*70*70));           // 中心への近さ 0..1
    if(Math.random()>0.30+0.70*toC) continue;       // 銀河中心側ほど高密度（非対称性）
    const sigma=5.5+6.0*toC;                        // バルジ側は帯が太い
    const g=(Math.random()+Math.random()+Math.random()+Math.random()-2)*1.73;
    const b=g*sigma;                                // 銀緯方向はガウス減衰
    const p=gal2ecl(l,b);
    pos[i*3]=p[0]*R; pos[i*3+1]=p[2]*R; pos[i*3+2]=-p[1]*R; // 黄道直交 → (x,z,-y)
    const br=(0.014+0.022*Math.random())*(0.35+0.65*toC);
    const warm=0.35+0.65*toC;                       // 中心側はやや暖色
    col[i*3]=br*(0.82+0.15*warm); col[i*3+1]=br*0.85; col[i*3+2]=br*(1.02-0.20*warm);
    sz[i]=42+Math.random()*55;
    i++;
  }
  const g2=new THREE.BufferGeometry();
  g2.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g2.setAttribute('color',new THREE.BufferAttribute(col,3));
  g2.setAttribute('asize',new THREE.BufferAttribute(sz,1));
  const mat=new THREE.ShaderMaterial({
    uniforms:{map:{value:SPR}},
    vertexShader:`attribute float asize;varying vec3 vC;void main(){vC=color;
      vec4 mv=modelViewMatrix*vec4(position,1.);
      gl_PointSize=asize*(600./-mv.z);
      gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform sampler2D map;varying vec3 vC;void main(){
      vec4 t=texture2D(map,gl_PointCoord);gl_FragColor=vec4(vC,1.)*t;}`,
    transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,vertexColors:true
  });
  celestialGroup.add(new THREE.Points(g2,mat));
}
buildMilkyWay();

/* --- 実際の星座境界（歳差ズレの可視化） --- */
// 境界は J2000 固定値で一度だけ描き、歳差は親の celestialGroup の回転に乗せる
// （個別に +1.39697*T を足すと親グループ回転と二重適用になるため廃止）
const realGroup=new THREE.Group(); realGroup.visible=false; celestialGroup.add(realGroup);
function buildReal(){
  IAU.slice(0,13).forEach(([b,n],i)=>{
    const a=b;
    const seg=[];
    for(let y=-7;y<=7;y+=1) seg.push(ecl2three(cos(a)*cos(y),sin(a)*cos(y),sin(y),SKY*0.97));
    realGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(seg),
      new THREE.LineBasicMaterial({color:0x7d9fd0,transparent:true,opacity:.4})));
    const prev=i===0?IAU[12][0]:IAU[i-1][0];
    let mid=prev+norm(a-prev)/2;
    const lb=label(n.replace('座',''),46,'#8fb4e0',.5);
    lb.position.copy(ecl2three(cos(mid)*cos(-9),sin(mid)*cos(-9),sin(-9),SKY*0.93));
    realGroup.add(lb);
  });
}
buildReal();

/* --- 地平線 ---
   時刻とともに毎フレーム作り直すとキャンバステクスチャを量産してしまうので、

const horizGroup=new THREE.Group(); scene.add(horizGroup);
let horizLine=null, horizLabel=null;
(function initHorizon(){
  const R=SKY*0.985, pts=[];
  for(let i=0;i<=180;i++){const a=i*2*D2R;pts.push(new THREE.Vector3(Math.cos(a)*R,0,Math.sin(a)*R));}
  horizLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),

function updateHorizon(z){

  horizLine.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),up);
  horizLabel.position.copy(up).multiplyScalar(SKY*0.9);
}

/* --- 占星術レイヤー（既定オフ / P4） ---

   ■ 描いているものが幾何学的に何なのか
   ハウスカスプは「黄経の値」であって、天球上の面ではない。3Dに落とすときに
   何を描くかは自明ではないので、ここでは意図的に **黄道帯の中の目盛り** として描く:
     カスプ … その黄経の位置に、黄緯 ±13° の範囲だけ短い弧を立てる
     ハウス番号 … 隣り合うカスプの中間の黄経に置く
   黄道極を通る大円（＝全天に伸びる分割面）にしていないのは、それが**嘘になる方式が
   あるから**。ホールサインとイコールは黄経だけで定義されるので大円で正しいが、
   プラシーダスは時角（半弧）の分割で定義されていて、その分割面は大円ですらない
   曲面になる。3方式で同じ描き方をしたいので、どの方式でも正しく読める
   「黄道上のどこがカスプか」だけを描き、面の形は主張しない。
   この簡略化は README の「既知の制約」にも書いてある。

   ■ ASC–DSC 軸と MC–IC 軸だけは定義が明快なので別扱い
   地平線・子午線が黄道と交わる点そのもの。天球側にはその黄経の位置に短い放射マークと
   ラベルを置き、中心の輪（下記）では ASC/MC 側を明るく、対向側（DSC/IC）を暗くした
   十字として描く。2軸がどちらを向いているかが一目で分かるようにするため。

   ■ アスペクト線は中心の小さな「輪」の中に引く
   アスペクトは黄経の角度関係なので、天体の実際の位置（距離モードで半径が変わる）を
   結ぶのではなく、**黄道面上のその黄経の点どうし**を弦で結ぶ。
   半径は天球（1500）ではなく 175 と小さく取ってある。天球いっぱいに弦を張ると
   視界を横切る線が星野より手前に来て、実データの星野が主役でなくなるため。
   オーブの狭さは加算合成の明るさで表す（WebGL の線幅は環境依存でほぼ効かない）。 */
const astroGroup=new THREE.Group(); astroGroup.visible=false; scene.add(astroGroup);
const CUSP_R=SKY*0.93, CUSP_LAT=13, WHEEL_R=175, ASPECT_MAX=66;
const cuspLines=[], cuspLabels=[], axisTicks={}, axisSpokes={}, axisLabels={};
(function initAstro(){
  for(let i=0;i<12;i++){
    const pts=[];
    for(let b=-CUSP_LAT;b<=CUSP_LAT;b+=2) pts.push(new THREE.Vector3());
    const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:0x9b8ac9,transparent:true,opacity:.32}));
    ln.frustumCulled=false; astroGroup.add(ln); cuspLines.push(ln);
    const lb=label(String(i+1),34,'#a595d6',.52); astroGroup.add(lb); cuspLabels.push(lb);
  }
  // アスペクト輪の縁（弦の行き先が見えるように、うっすらとだけ）
  const ring=[];
  for(let i=0;i<=360;i+=2) ring.push(ecl2three(cos(i),sin(i),0,WHEEL_R));
  astroGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ring),
    new THREE.LineBasicMaterial({color:0x7d6fb0,transparent:true,opacity:.13})));
  for(const [k,col,op] of [['asc','#d9b45f',.60],['dsc','#8a7238',.28],
                           ['mc','#e6dcbc',.60],['ic','#7d6fb0',.28]]){
    const mk=(op2)=>{ const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
        [new THREE.Vector3(),new THREE.Vector3()]),
        new THREE.LineBasicMaterial({color:new THREE.Color(col),transparent:true,opacity:op2}));
      ln.frustumCulled=false; astroGroup.add(ln); return ln; };
    axisTicks[k]=mk(op);            // 天球側の放射マーク（0.88 → 0.995）
    axisSpokes[k]=mk(op*0.8);       // 中心の輪の中の十字（0 → WHEEL_R）
    const lb=label(k.toUpperCase(),42,col,op+0.18); astroGroup.add(lb); axisLabels[k]=lb;
  }
})();
const aspGeo=new THREE.BufferGeometry();
aspGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(ASPECT_MAX*2*3),3));
aspGeo.setAttribute('color',   new THREE.BufferAttribute(new Float32Array(ASPECT_MAX*2*3),3));

let chart=null, natalChart=null, useDist=true, focusKey=null, showTrails=true;

let astroOn=false, houseMethod='whole', aspectSet='core', orbScale=1, showInterp=false;

/* --- 天体の配置 --- */
function bodyVec(p){
  const r=Math.hypot(p.x,p.y,p.z)||1;
  const rad = useDist
    ? Math.min(210 + Math.log10(p.dist*AU/1000)*118, SKY*0.9)   // 対数距離
    : SKY*0.86;
  return ecl2three(p.x/r,p.y/r,p.z/r,rad);
}
/* snap=true で補間を挟まず即反映（スクラブ・再生中）。
   snap=false のときだけ lerp が効く（トグル操作時のなめらかな移り変わり用） */
function placeBodies(snap){
  if(!chart) return;
  BODIES.forEach(b=>{
    const v=bodyVec(chart[b.k]);
    posTarget[b.k]=v;
    if(!posNow[b.k]) posNow[b.k]=v.clone();
    else if(snap) posNow[b.k].copy(v);
  });
}
function updateMarks(){
  BODIES.forEach(b=>{
    const m=marks[b.k], t=posTarget[b.k]; if(!t) return;
    posNow[b.k].lerp(t,0.06);
    const p=posNow[b.k];
    m.sp.position.copy(p);
    const foc = focusKey===b.k;
    const base=b.s*26*(useDist?1:0.85);
    const sc=base*(foc?1.7:1);
    m.sp.scale.set(sc,sc,1);
    m.sp.material.opacity=focusKey&&!foc?0.45:1;
    m.lb.position.copy(p).add(new THREE.Vector3(0,base*0.9,0));
    m.lb.material.opacity += ((foc?0.95:0.0)-m.lb.material.opacity)*0.12;
    const arr=m.ray.geometry.attributes.position;
    const far=p.clone().normalize().multiplyScalar(SKY*0.985);
    arr.setXYZ(0,0,0,0); arr.setXYZ(1,far.x,far.y,far.z); arr.needsUpdate=true;
    m.ray.material.opacity += ((foc?0.5:0.13)-m.ray.material.opacity)*0.1;
  });
}

/* --- 出生図のマーカー（トランジットとの対比用・解釈は持たない） --- */
/* **celestialGroup ではなく scene に足すこと。** celestialGroup の下に入れると
   歳差でマーカー自身が回ってしまい、カードに出す「出生時からの黄経差」が
   歳差ぶん狂う。出生図の位置はその日の黄道座標に固定しておく */
const natalGroup=new THREE.Group(); natalGroup.visible=false; scene.add(natalGroup);
const natalMarks={};
BODIES.forEach(b=>{
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(b.c),transparent:true,
    opacity:.30,blending:THREE.AdditiveBlending,depthTest:false}));
  natalGroup.add(sp); natalMarks[b.k]=sp;
});
function placeNatal(){
  if(!natalChart) return;
  BODIES.forEach(b=>{
    const sp=natalMarks[b.k];
    sp.position.copy(bodyVec(natalChart[b.k]));
    const s=b.s*26*(useDist?1:0.85)*0.55;
    sp.scale.set(s,s,1);
  });
}

/* --- 占星術レイヤーの更新（オンのときだけ呼ばれる） --- */
const ASPECT_COLORS=new Map();
const colorOf=hex=>{ let c=ASPECT_COLORS.get(hex);
  if(!c){ c=new THREE.Color(hex); ASPECT_COLORS.set(hex,c); } return c; };
/** 黄道傾斜角から決まる極圏。ここを超えると「東の地平線」という言い方が成立しない */
const POLAR_CIRCLE=66.56;
function updateAstro(){
  if(!chart) return;
  houses=computeHouses(chart,latDeg,houseMethod);
  const cusps=houses.cusps;
  for(let i=0;i<12;i++){
    const arr=cuspLines[i].geometry.attributes.position;
    let n=0;
    for(let b=-CUSP_LAT;b<=CUSP_LAT;b+=2){
      const v=eclLL(cusps[i],b,CUSP_R); arr.setXYZ(n++,v.x,v.y,v.z);
    }
    arr.needsUpdate=true;
    const span=norm(cusps[(i+1)%12]-cusps[i])||30;   // ハウス番号は区間の中央へ
    cuspLabels[i].position.copy(eclLL(norm(cusps[i]+span/2),-CUSP_LAT-5,CUSP_R*0.98));
  }
  for(const k of ['asc','dsc','mc','ic']){
    const dir=eclLL(houses[k],0,1);
    const t=axisTicks[k].geometry.attributes.position;
    t.setXYZ(0,dir.x*SKY*0.88,dir.y*SKY*0.88,dir.z*SKY*0.88);
    t.setXYZ(1,dir.x*SKY*0.995,dir.y*SKY*0.995,dir.z*SKY*0.995); t.needsUpdate=true;
    const s=axisSpokes[k].geometry.attributes.position;
    s.setXYZ(0,0,0,0); s.setXYZ(1,dir.x*WHEEL_R,dir.y*WHEEL_R,dir.z*WHEEL_R); s.needsUpdate=true;
    axisLabels[k].position.copy(dir).multiplyScalar(SKY*0.845);
  }
  const set=BODY_SETS.find(s=>s.k===aspectSet);
  aspects = set ? findAspects(chart,{rates:lastRates,orbScale,bodies:set.keys}) : [];
  const pos=aspGeo.attributes.position, col=aspGeo.attributes.color;
  let n=0;
  for(const a of aspects.slice(0,ASPECT_MAX)){
    // 天体の実位置ではなく「その黄経の黄道面上の点」を結ぶ（アスペクトは黄経の関係）
    const pa=eclLL(chart[a.a].lon,0,WHEEL_R*0.97), pb=eclLL(chart[a.b].lon,0,WHEEL_R*0.97);
    const c=colorOf(a.color), k=0.14+0.62*a.tightness;   // オーブが狭いほど明るい
    pos.setXYZ(n,pa.x,pa.y,pa.z); col.setXYZ(n,c.r*k,c.g*k,c.b*k); n++;
    pos.setXYZ(n,pb.x,pb.y,pb.z); col.setXYZ(n,c.r*k,c.g*k,c.b*k); n++;
  }
  pos.needsUpdate=true; col.needsUpdate=true; aspGeo.setDrawRange(0,n);
  showAstroNote();
  uiDirty=true;
}
/** 方式の説明と、フォールバック・高緯度の注意。**黙って別方式に変わるのを避ける** */
function showAstroNote(){
  const el=document.getElementById('astroNote');
  let cls='', tx;
  if(houses.fallback){
    cls='warn';
    tx=`${houses.fallback.text}。ホールサインで表示しています`;
  }else{
    tx=HOUSE_METHODS.find(m=>m.k===houses.method).d;
    if(Math.abs(latDeg)>POLAR_CIRCLE)
      tx+=' / 極圏なので、黄道が西側で昇り ASC が西半分に来ることがあります';
  }
  const key=cls+'|'+tx;
  if(key!==lastNote){ el.className=cls; el.textContent=tx; lastNote=key; }
}
/** 解釈テキストの取得。既定のプロバイダは空を返すので、通常は「未接続」の表示になる。
    毎フレームは呼ばない（時刻を動かしている間は取りに行かない） */
async function refreshInterp(){
  if(!astroOn||!showInterp||!chart){ interpTexts={}; uiDirty=true; return; }
  const set=BODY_SETS.find(s=>s.k===aspectSet);
  interpTexts=await interpret(interpretationKeys({
    chart, houses, aspects, bodies:(set?set.keys:BODIES.map(b=>b.k))
  }));
  uiDirty=true;
}

/* --- 軌跡（逆行区間を色分け） ---
   computeChart は実測 19.5µs/回。現在時刻ぶん（3回/フレーム）は誤差だが、
   軌跡は 110 サンプル ≒ 2.2ms かかるので毎フレームは避けて間引く */
const TRAIL_N=110;
const trailGroup=new THREE.Group(); scene.add(trailGroup);
const trails={};
BODIES.forEach(b=>{
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(TRAIL_N*2*3),3));
  g.setAttribute('color',   new THREE.BufferAttribute(new Float32Array(TRAIL_N*2*3),3));
  const o=new THREE.LineSegments(g,new THREE.LineBasicMaterial({vertexColors:true,
    transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false}));
  o.frustumCulled=false; o.visible=false;
  trailGroup.add(o); trails[b.k]=o;
});
let lastTrailJdUT=null, lastTrailKey='';
/* サンプル間隔より速く動く天体は折り返しを拾えない（エイリアス）ので軌跡を描かない。
   スケールだけで決まり時刻には依らないので、読み出しパネルもこの判定を共有する */
function trailAliased(b){ return b.mo*(SCALES[scale].trail/(TRAIL_N-1))>30; }
function rebuildTrails(){
  const win=SCALES[scale].trail, step=win/(TRAIL_N-1);
  const samples=new Array(TRAIL_N);
  for(let i=0;i<TRAIL_N;i++){
    const jdUT=Math.max(JD_MIN_UT,Math.min(JD_MAX_UT, curJdUT-win+step*i));
    samples[i]=computeChart(jdUT,latDeg,lonDeg);
  }
  BODIES.forEach(b=>{
    const o=trails[b.k];
    if(trailAliased(b)){ o.visible=false; return; }
    const pos=o.geometry.attributes.position.array;
    const col=o.geometry.attributes.color.array;
    const base=new THREE.Color(b.c);
    let n=0;
    for(let i=0;i<TRAIL_N-1;i++){
      const p0=samples[i][b.k], p1=samples[i+1][b.k];
      const a=bodyVec(p0), c=bodyVec(p1);
      const back=deltaLon(p0.lon,p1.lon)<0;          // 0°/360°を考慮した差分
      const age=0.10+0.90*(i/(TRAIL_N-2));           // 古いほど暗く
      const cr=(back?1.00:base.r*0.70)*age,
            cg=(back?0.42:base.g*0.70)*age,
            cb=(back?0.28:base.b*0.70)*age;
      pos[n*3]=a.x;pos[n*3+1]=a.y;pos[n*3+2]=a.z;
      col[n*3]=cr;col[n*3+1]=cg;col[n*3+2]=cb;n++;
      pos[n*3]=c.x;pos[n*3+1]=c.y;pos[n*3+2]=c.z;
      col[n*3]=cr;col[n*3+1]=cg;col[n*3+2]=cb;n++;
    }
    o.geometry.setDrawRange(0,n);
    o.geometry.attributes.position.needsUpdate=true;
    o.geometry.attributes.color.needsUpdate=true;
    o.visible=true;
  });
  lastTrailJdUT=curJdUT; lastTrailKey=scale+'|'+useDist;
}

/* --- 読み出しパネル（毎フレームの DOM 更新を避け、変化した行だけ書き換える） --- */

function updateCard(){

/** カードの占星術ぶん（ハウス・その天体に効いているアスペクト・解釈テキスト） */
function updateAstroCard(p){
  const show=astroOn&&!!houses;
  cdHouseK.hidden=cdHouse.hidden=!show;
  if(show){
    const h=houseOf(p.lon,houses.cusps);
    const m=HOUSE_METHODS.find(x=>x.k===houses.method);
    cdHouse.textContent=`第${h}ハウス（${m.n}${houses.fallback?'・代替':''}）`;
    const mine=aspects.filter(a=>a.a===focusKey||a.b===focusKey);
    const tx=mine.slice(0,5).map(a=>{
      const other=a.a===focusKey?a.b:a.a;
      const nm=BODIES.find(b=>b.k===other).n;
      const ap=a.applying===null?'':(a.applying?' 接':' 離');
      return `${a.sym} ${nm} ${a.orbAbs.toFixed(1)}°${ap}`;
    }).join('<br>');
    cdAspK.hidden=cdAsp.hidden=!mine.length;
    if(mine.length) cdAsp.innerHTML=tx+(mine.length>5?`<br>ほか${mine.length-5}`:'');
  }else{ cdAspK.hidden=cdAsp.hidden=true; }
  // 解釈テキストは外部データ。既定のスタブでは何も返らないので、その旨を出す
  const box=document.getElementById('cdInterp');
  if(!astroOn||!showInterp){ box.hidden=true; return; }
  box.hidden=false;
  const keys=[`body/${focusKey}/sign/${signKey(p.lon)}`];
  if(houses) keys.push(`body/${focusKey}/house/${houseOf(p.lon,houses.cusps)}`);
  const got=keys.map(k=>interpTexts[k]).filter(Boolean);
  if(got.length){ box.className=''; box.innerHTML=got.join('<br>'); }
  else{
    box.className='none';
    box.textContent=hasInterpreter()
      ? 'この配置の解釈テキストは提供されていません'
      : '解釈テキストは同梱していません（外部データを接続すると表示されます）';
  }
}
function setFocus(k){
  focusKey = focusKey===k?null:k;
  BODIES.forEach(b=>rowRefs[b.k].row.classList.toggle('on',focusKey===b.k));
  updateCard();
}

/* ============================================================
   4. 時間軸
   ============================================================ */
/* このファイルが扱うユリウス日は **すべて UT**（暦日と Intl から作るので当然 UT になる）。
   軌道理論に要る力学時 TT への変換は computeChart の中だけで起きる。
   取り違えの影響は非対称で、GMST に TT を渡すと地平線が 0.27° 回る（src/deltat.mjs 参照）。
   端は 12:00 UT に置く。どのタイムゾーンで表示しても暦年が 1800–2050 に収まるようにするため */
const JD_MIN_UT=julianDay(1800,1,1,12,0,0), JD_MAX_UT=julianDay(2050,12,31,12,0,0);
// half: スライダー窓の半幅（日）, rate: 再生の基準速度（日/秒）, trail: 軌跡の保持期間（日）
const SCALES={
  hour :{half:1,     rate:1/24,   trail:2},
  day  :{half:15,    rate:1,      trail:30},
  month:{half:183,   rate:30.44,  trail:400},
  year :{half:46000, rate:365.25, trail:4000}   // half が全範囲を覆うのでスライダーは 1800–2050 全域
};
const SPEEDS=[-64,-16,-4,-1,1,4,16,64];
/* 逆行判定の中心差分の幅（日）。
   **再生速度やフレーム間隔には絶対に連動させないこと。** 連動させると一時停止中に
   h→0 となり、0/0 で判定が壊れる（速度を上げると留の位置が動く、という形でも出る）。
   逆行かどうかは「その瞬間の天体の性質」であって、こちらの再生の都合とは無関係 */
const RATE_DT=0.5;
let scale='hour', speedIdx=4, playing=false;
let natalJdUT=0, curJdUT=0, winCenter=0, edgeHit=null, scrubbing=false, uiDirty=true;

const elPlay=document.getElementById('tPlay'), elSpeed=document.getElementById('tSpeed'),
      elSlide=document.getElementById('tslide'), elNow=document.getElementById('tnow');

function winRange(){
  const h=SCALES[scale].half;
  if(2*h>=JD_MAX_UT-JD_MIN_UT) return [JD_MIN_UT,JD_MAX_UT];
  let lo=winCenter-h, hi=winCenter+h;
  if(lo<JD_MIN_UT){ hi+=JD_MIN_UT-lo; lo=JD_MIN_UT; }
  if(hi>JD_MAX_UT){ lo-=hi-JD_MAX_UT; hi=JD_MAX_UT; }
  return [lo,hi];
}
function followHorizon(){ return scale==='hour'||scale==='day'; }
function refreshHorizon(){
  // 地平線は地方恒星時に依存し1日で一周する。時/日スケールでは時刻に追従させ、
  // 月/年スケールでは出生時で固定する（追従させても点滅にしか見えないため）
  const z = followHorizon() ? chart._zenith : (natalChart?natalChart._zenith:chart._zenith);
  updateHorizon(z);
  document.getElementById('tHorizTx').textContent=followHorizon()?'地平線':'地平線（出生時）';
}
function applyTime(snap){
  chart=computeChart(curJdUT,latDeg,lonDeg);
  applyPrecession(chart._T);                           // 歳差は時刻に追従する
  const r=lonRates(curJdUT,RATE_DT,latDeg,lonDeg);
  BODIES.forEach(b=>{ retro[b.k]=r[b.k]<0; });
  lastRates=r;                                         // 接近／分離の判定にそのまま使う
  placeBodies(snap);
  if(astroOn) updateAstro();                           // オフなら計算ごと起きない
  refreshHorizon();
  syncTimeUI();
  uiDirty=true;
}
function setTime(jdUT,snap){
  edgeHit = jdUT<JD_MIN_UT?'min' : jdUT>JD_MAX_UT?'max' : null;
  if(edgeHit&&playing) setPlaying(false);
  curJdUT=Math.max(JD_MIN_UT,Math.min(JD_MAX_UT,jdUT));
  const [lo,hi]=winRange();
  if(curJdUT<lo-1e-9||curJdUT>hi+1e-9) winCenter=curJdUT;
  applyTime(snap);
}
function setPlaying(v){
  playing=v;
  elPlay.textContent=playing?'❙❙':'▶';
  elPlay.classList.toggle('on',playing);
}
function fmtSpan(a){
  if(a<1/24)  return (a*1440).toFixed(0)+'分';
  if(a<2)     return (a*24).toFixed(1)+'時間';
  if(a<400)   return a.toFixed(1)+'日';
  return (a/365.25).toFixed(2)+'年';
}
function syncTimeUI(){
  const [lo,hi]=winRange();
  if(!scrubbing) elSlide.value=String(hi>lo?(curJdUT-lo)/(hi-lo):0.5);
  // 表示は現地時刻。オフセットは**その時点で**引き直す（時間軸が夏時間の境界を
  // またぐと表示が1時間跳ぶ。固定オフセットだったP2では起きなかった正しい挙動）
  const u=jdToZoned(tzId,curJdUT), p=n=>String(n).padStart(2,'0');
  const off=curJdUT-natalJdUT;
  let html=`${u.y}.${p(u.m)}.${p(u.d)} ${p(u.h)}:${p(u.mi)}`;
  html += Math.abs(off)<1e-6 ? ' <span class="off">出生時</span>'
        : ` <span class="off">${off<0?'−':'+'}${fmtSpan(Math.abs(off))}</span>`;
  if(edgeHit) html += ` <span class="edge">▍${edgeHit==='min'?'下限 1800':'上限 2050'}</span>`;
  elNow.innerHTML=html;
  elSpeed.textContent=(SPEEDS[speedIdx]<0?'◀×':'×')+Math.abs(SPEEDS[speedIdx]);
}
elPlay.onclick=()=>setPlaying(!playing);
document.getElementById('tFaster').onclick=()=>{
  speedIdx=Math.min(SPEEDS.length-1,speedIdx+1); syncTimeUI(); };
document.getElementById('tSlower').onclick=()=>{
  speedIdx=Math.max(0,speedIdx-1); syncTimeUI(); };
document.getElementById('tHome').onclick=()=>{
  setPlaying(false); winCenter=natalJdUT; setTime(natalJdUT,true); };
document.querySelectorAll('#scales .tb').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('#scales .tb').forEach(x=>x.classList.remove('on'));
    btn.classList.add('on');
    scale=btn.dataset.s;
    winCenter=curJdUT;                 // 窓を現在時刻に寄せ直す
    lastTrailJdUT=null;
    applyTime(true);
  };
});
elSlide.addEventListener('input',()=>{
  scrubbing=true;
  const [lo,hi]=winRange();
  setTime(lo+(+elSlide.value)*(hi-lo),true);
});
['change','pointerup','pointercancel','touchend','blur'].forEach(ev=>
  elSlide.addEventListener(ev,()=>{ scrubbing=false; }));

const elLat=document.getElementById('lat'), elLon=document.getElementById('lon'),
      elTz=document.getElementById('tz'), elPlace=document.getElementById('place'),
      elQ=document.getElementById('q'), elQMsg=document.getElementById('qmsg'),
      elTzInfo=document.getElementById('tzinfo');

function run(){
  const dv=document.getElementById('d').value, tv=document.getElementById('t').value||'12:00';
  if(!dv) return;
  const [Y,M,D]=dv.split('-').map(Number), [h,mi]=tv.split(':').map(Number);
  const la=parseFloat(elLat.value)||0;
  const lo=parseFloat(elLon.value)||0;
  const tz=isValidZone(elTz.value)?elTz.value:'UTC';
  latDeg=la; lonDeg=lo; tzId=tz;
  // 固定オフセットではなく IANA ゾーンで換算するので、夏時間期間の出生時刻も合う
  const z=zonedToJd(tz,Y,M,D,h,mi);
  natalJdUT=Math.max(JD_MIN_UT,Math.min(JD_MAX_UT,z.jd));
  natalChart=computeChart(natalJdUT,latDeg,lonDeg);
  winCenter=natalJdUT; edgeHit=null;
  setPlaying(false);
  setTime(natalJdUT,true);
  placeNatal();
  lastTrailJdUT=null;
  focusKey=null; document.getElementById('card').classList.remove('show');
  BODIES.forEach(b=>rowRefs[b.k].row.classList.remove('on'));
  if(astroOn) refreshInterp();      // 解釈は出生データの確定時にだけ取りに行く
  showTzInfo(z);
  document.getElementById('stamp').innerHTML =
    `${dv.replace(/-/g,'.')} ${tv} <span class="off">${formatOffset(z.offsetSeconds)}</span>`
    +`<br>${la.toFixed(2)}° ${lo.toFixed(2)}°<br>JD(UT) ${natalJdUT.toFixed(4)}`;
  tR=useDist?430:300;
}

/** 出生時刻に効いた実際のオフセットと、夏時間の境界にかかった場合の注意を出す */
function showTzInfo(z){
  let note='';
  if(z.status==='nonexistent'){
    // 繰り上げで飛ばされた時刻。切り替え前のオフセットを当てた結果、
    // 実際には別の壁時計時刻になっている。その着地点を出さないと何が起きたか伝わらない
    const a=jdToZoned(tzId,z.jd), p=n=>String(n).padStart(2,'0');
    note='<span class="warn">この時刻は夏時間の繰り上げで存在しません。'
      +`${p(a.h)}:${p(a.mi)} として解釈しています</span>`;
  }else if(z.status==='ambiguous'){
    note='<span class="warn">この時刻は夏時間の終了で2回あります。'
      +'先に来るほう（夏時間側）で解釈しています</span>';
  }
  elTzInfo.innerHTML=`出生時のオフセット <b>${formatOffset(z.offsetSeconds)}</b>`
    +(note?' · '+note:'');
}

/* --- 場所プリセット（オフラインでも使える経路） ---
   タイムゾーンは固定オフセットではなく IANA のゾーンIDで持つ */
const PLACES=[
  ['東京',35.68,139.77,'Asia/Tokyo'],       ['大阪',34.69,135.50,'Asia/Tokyo'],
  ['札幌',43.06,141.35,'Asia/Tokyo'],       ['那覇',26.21,127.68,'Asia/Tokyo'],
  ['金沢',36.56,136.66,'Asia/Tokyo'],       ['仙台',38.27,140.87,'Asia/Tokyo'],
  ['福岡',33.59,130.40,'Asia/Tokyo'],       ['ソウル',37.57,126.98,'Asia/Seoul'],
  ['シンガポール',1.35,103.82,'Asia/Singapore'],
  ['シドニー',-33.87,151.21,'Australia/Sydney'],
  ['ロンドン',51.51,-0.13,'Europe/London'], ['パリ',48.86,2.35,'Europe/Paris'],
  ['ニューヨーク',40.71,-74.01,'America/New_York'],
  ['ロサンゼルス',34.05,-118.24,'America/Los_Angeles'],
  ['レイキャビク',64.15,-21.94,'Atlantic/Reykjavik'],
  ['カスタム入力',null,null,null]
];

/* ゾーン選択は Intl 由来の一覧から作る（外部ライブラリなし・追加バイトなし）。
   Intl.supportedValuesOf が無い環境では timezone.mjs 側の控えに落ちる */
(function(){
  for(const z of zoneList()){
    const o=document.createElement('option'); o.value=z; o.textContent=z; elTz.appendChild(o);
  }
  elTz.value='Asia/Tokyo';
  elTz.onchange=()=>{ if(natalJdUT) run(); };
})();

/* プリセットと検索結果を同じ select に載せる。検索結果は先頭のグループへ積む */
let searchGroup=null;
function fillPlaces(){
  elPlace.innerHTML='';
  const g=document.createElement('optgroup'); g.label='プリセット';
  PLACES.forEach((p,i)=>{
    const o=document.createElement('option'); o.value='p'+i; o.textContent=p[0]; g.appendChild(o);
  });
  elPlace.appendChild(g);
}
fillPlaces();
elPlace.onchange=()=>{
  const v=elPlace.value;
  if(v.startsWith('p')){
    const p=PLACES[+v.slice(1)];
    if(p[1]===null) return;                       // カスタム入力は緯度経度を触らない
    elLat.value=p[1]; elLon.value=p[2]; elTz.value=p[3];
  }else{
    const r=lastResults[+v.slice(1)]; if(!r) return;
    elLat.value=r.lat.toFixed(4); elLon.value=r.lon.toFixed(4);
    if(r.timezone&&isValidZone(r.timezone)) elTz.value=r.timezone;
  }
  if(natalJdUT) run();
};

/* --- 出生地の検索（Open-Meteo / キー不要）---
   結果は緯度経度とゾーンを「埋めるだけ」で、以後は手で微調整できる。
   失敗してもプリセットと直接入力はそのまま使えるので、オフラインでも動く */
let lastResults=[], searching=false;
async function doSearch(){
  if(searching) return;
  const q=elQ.value.trim();
  if(!q){ elQMsg.className='err'; elQMsg.textContent='地名を入力してください'; return; }
  searching=true;
  elQMsg.className=''; elQMsg.textContent='検索中…';
  const r=await searchPlace(q);
  searching=false;
  if(!r.ok){
    elQMsg.className='err'; elQMsg.textContent=reasonText(r.reason);
    return;
  }
  lastResults=r.results;
  fillPlaces();
  if(searchGroup) searchGroup.remove();
  searchGroup=document.createElement('optgroup');
  searchGroup.label=`検索結果「${q}」`;
  lastResults.forEach((x,i)=>{
    const o=document.createElement('option');
    o.value='s'+i;
    o.textContent=`${x.label}${x.timezone?'　'+x.timezone:''}`;
    searchGroup.appendChild(o);
  });
  elPlace.insertBefore(searchGroup,elPlace.firstChild);
  elPlace.value='s0';
  elQMsg.className='ok';
  elQMsg.textContent=`${lastResults.length}件 · 緯度経度とタイムゾーンを反映しました（手で微調整できます）`;
  elPlace.onchange();
}
document.getElementById('qgo').onclick=doSearch;
elQ.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); doSearch(); } });

/* --- UI --- */
document.getElementById('run').onclick=run;
document.getElementById('grip').onclick=()=>{
  const c=document.getElementById('console');
  c.classList.toggle('open');
  document.getElementById('gripState').textContent=c.classList.contains('open')?'閉じる':'開く';
};
function toggle(id,fn){
  const el=document.getElementById(id);
  el.onclick=()=>{el.classList.toggle('on');fn(el.classList.contains('on'));};
}
toggle('tDist',v=>{useDist=v;placeBodies(false);placeNatal();lastTrailJdUT=null;tR=v?430:300;});
toggle('tHoriz',v=>{horizGroup.visible=v;});
toggle('tTrail',v=>{showTrails=v;uiDirty=true;});   // ⌁ 印の出し入れを読み出しに反映
zodiacGroup.children.forEach(c=>{if(c.material) c.userData.base=c.material.opacity;});
toggle('tReal',v=>{realGroup.visible=v;zodiacGroup.children.forEach(c=>{
  if(c.material) c.material.opacity = c.userData.base*(v?0.4:1);});});

/* --- 占星術レイヤーのUI ---
   既定オフ。オンにしたときだけ方式・オーブ・解釈の操作列が現れる */
const elAstroPanel=document.getElementById('astroPanel');
toggle('tAstro',v=>{
  astroOn=v;
  astroGroup.visible=v;
  elAstroPanel.hidden=!v;
  showAngRows();
  if(v){ updateAstro(); refreshInterp(); }
  else { houses=null; aspects=[]; }
  uiDirty=true;
});
document.getElementById('hsMethod').onchange=e=>{
  houseMethod=e.target.value;
  if(astroOn){ updateAstro(); refreshInterp(); }
};
document.getElementById('aspSet').onchange=e=>{
  aspectSet=e.target.value;
  if(astroOn){ updateAstro(); refreshInterp(); }
};
const elOrb=document.getElementById('orb');
elOrb.oninput=()=>{
  orbScale=+elOrb.value;
  document.getElementById('orbTx').textContent='×'+orbScale.toFixed(1);
  if(astroOn) updateAstro();
};
toggle('tInterp',v=>{ showInterp=v; refreshInterp(); });

/* --- カメラ操作 --- */
let drag=false,px=0,py=0,pd=0;
cv.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointerup',e=>{drag=false;});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  tTheta-=(e.clientX-px)*0.005; tPhi-=(e.clientY-py)*0.005;
  tPhi=Math.max(0.12,Math.min(Math.PI-0.12,tPhi));
  px=e.clientX;py=e.clientY;
});
cv.addEventListener('wheel',e=>{e.preventDefault();tR=Math.max(60,Math.min(1350,tR*(1+e.deltaY*0.0012)));},{passive:false});
cv.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(pd) tR=Math.max(60,Math.min(1350,tR*(pd/d)));
    pd=d;
  }
},{passive:true});
cv.addEventListener('touchend',()=>{pd=0;});

// 天体タップ
const ray=new THREE.Raycaster();
cv.addEventListener('click',e=>{
  const m=new THREE.Vector2(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(m,camera);
  const hit=ray.intersectObjects(bodyGroup.children.filter(o=>o.userData.k));
  if(hit.length) setFocus(hit[0].object.userData.k);
});

function resize(){
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

let t0=performance.now(), uiAcc=0;
(function loop(){
  requestAnimationFrame(loop);
  const now=performance.now(), dt=(now-t0)/1000; t0=now;

  // 再生（1フレームあたり computeChart 3回 ≒ 59µs）
  if(playing) setTime(curJdUT + SCALES[scale].rate*SPEEDS[speedIdx]*dt, true);

  // 軌跡: 毎フレームだと 2.2ms 取られるので、窓の 1/220 動いたときだけ作り直す。
  // prefers-reduced-motion では再生中は動かさず、止まってから描く
  const trailPaused = REDUCED && playing;
  trailGroup.visible = showTrails && !trailPaused;
  if(showTrails && chart && !trailPaused){
    const key=scale+'|'+useDist;
    if(key!==lastTrailKey || lastTrailJdUT===null ||
       Math.abs(curJdUT-lastTrailJdUT)>SCALES[scale].trail/220) rebuildTrails();
  }
  natalGroup.visible = !!natalChart && Math.abs(curJdUT-natalJdUT)>0.02;

  // 読み出しパネルの DOM 更新は 8Hz に間引く
  uiAcc+=dt;
  if(uiDirty && uiAcc>0.12){ uiAcc=0; uiDirty=false; updateReadout(); updateCard(); }

  camR+=(tR-camR)*0.07; camTheta+=(tTheta-camTheta)*0.1; camPhi+=(tPhi-camPhi)*0.1;
  if(!drag && !REDUCED) tTheta+=dt*0.012;
  camera.position.set(
    camR*Math.sin(camPhi)*Math.cos(camTheta),
    camR*Math.cos(camPhi),
    camR*Math.sin(camPhi)*Math.sin(camTheta));
  camera.lookAt(0,0,0);
  updateMarks();
  renderer.render(scene,camera);
})();

buildReadout();
run();
setTimeout(()=>{
  document.getElementById('console').classList.remove('open');
  document.getElementById('gripState').textContent='開く';
},1400);
</script>
</body>
