<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="celestia">
  <title>celestia</title>
  <!-- 背景は透過。属性の #C9A227 がライト時の既定色、ダーク時のみ CSS で上書きする。
       （resvg 等 media query 非対応のラスタライザではライト色で描画される） -->
  <style>
    @media (prefers-color-scheme: dark) {
      .ln { stroke: #E8C766; }
      .st { fill: #E8C766; }
    }
  </style>
  <g class="ln" fill="none" stroke="#C9A227" stroke-width="2.3" stroke-linecap="round">
    <path d="M25.85 8.30A12.5 12.5 0 1 1 17.74 3.62"/>
    <path d="M3.5 16A12.5 5.8 0 1 1 28.5 16A12.5 5.8 0 1 1 3.5 16Z" transform="rotate(-23.4 16 16)"/>
  </g>
  <circle class="st" cx="22.45" cy="4.83" r="1.7" fill="#C9A227"/>
</svg>
